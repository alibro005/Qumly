<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Qumly logo</title>
  <desc>A wordmark for Qumly with an icon combining database table rows and a chat bubble tail, representing natural language to SQL.</desc>

  <!-- Background -->
  <rect width="680" height="260" fill="#FFFFFF"/>

  <!-- Icon mark: stacked table rows morphing into a chat tail -->
  <g>
    <rect x="70" y="60" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="70" y="103" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="70" y="146" width="76" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  </g>
  <!-- Chat tail cut from the third row -->
  <path d="M146 163 L172 180 L146 180 Z" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="230" y="130" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="500" fill="#26215C" dominant-baseline="central">Qumly</text>
  <text x="232" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#534AB7" dominant-baseline="central">Ask your database anything</text>
</svg>
